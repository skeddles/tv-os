# TV PC: send sound to the TV over HDMI, not the PC's built-in speaker.
# WirePlumber ranks the analog profile higher by default (6565 vs 5965 for HDMI
# on this HP's Intel HDA card). These preferences are tried in order and
# unavailable ones (TV off) are skipped, so the speaker is used only while the
# TV is off. Verified on the TV Nov 1: without this rule WirePlumber chose
# output:analog-stereo+input:analog-stereo; with it, output:hdmi-stereo.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.pci-*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "output:hdmi-stereo"
          "output:hdmi-stereo-extra1"
          "output:hdmi-stereo-extra2"
          "output:hdmi-stereo+input:analog-stereo"
          "output:analog-stereo+input:analog-stereo"
          "output:analog-stereo"
        ]
      }
    }
  }
]
